name: Python CI Workflow (No Actions)

on:
  push:
    branches: [ main ]

jobs:
  run-python-scripts:
    runs-on: ubuntu-latest

    steps:
      # STEP: Print Python version (default from runner)
      - name: Show Python version
        run: python --version

      # STEP: Run all Python files in repo
      - name: Execute Python scripts
        run: |
          echo "Running all Python files..."
          for file in $(find $GITHUB_WORKSPACE -name "*.py"); do
            echo "---- Running $file ----"
            python "$file"
          done
